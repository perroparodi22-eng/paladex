[project]
name = "paladex"
version = "0.1.0"
description = "Parodi Group — Global Honey Intelligence Platform (local backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "feedparser>=6.0",
  "pdfplumber>=0.11",
  "python-dateutil>=2.9",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "openpyxl>=3.1",
  "rapidfuzz>=3.6",
  "xlrd>=2.0",            # TÜİK statistical tables are legacy .xls (openpyxl reads .xlsx only)
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "fpdf2>=2.7"]  # fpdf2: regenerates USDA fixture PDFs only

[project.scripts]
paladex = "paladex.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paladex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
